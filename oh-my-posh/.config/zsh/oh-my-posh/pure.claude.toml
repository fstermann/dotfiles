# Source: https://github.com/JanDeDobbeleer/oh-my-posh/blob/main/themes/pure.omp.json
# Docs: https://ohmyposh.dev/docs/segments/agents/claude
"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
console_title_template = "{{if .Root}}(Admin){{end}} {{.PWD}}"
version = 4

[palette]
red          = "#bf616a"
green        = "#a3be8c"
blue         = "#81a1c1"
cyan         = "#88c0d0"
pink         = "#ffafd7"
yellow       = "#ebcb8b"
gray         = "#6c6c6c"

model-fg       = "#c4b8f5"
session-fg     = "#c2d8f6"
rate5h-fg      = "#dfd6b3"
rate7d-fg      = "#b9e0cf"

[[blocks]]
alignment = "left"
type = "prompt"

  [[blocks.segments]]
  foreground = "p:red"
  style = "plain"
  template = "{{ .UserName }} "
  type = "session"

  [[blocks.segments]]
  foreground = "p:blue"
  style = "plain"
  template = "{{ .Path }} "
  type = "path"

    [blocks.segments.options]
    style = "full"

[[blocks]]
alignment = "left"
type = "prompt"

  [[blocks.segments]]
  foreground = "p:gray"
  style = "plain"
  template = "{{ .UpstreamIcon }} {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}<p:pink>*</>{{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "
  type = "git"

    [blocks.segments.options]
    branch_ahead_icon = "<p:cyan>⇡ </>"
    branch_behind_icon = "<p:cyan>⇣ </>"
    branch_icon = ""
    fetch_status = true
    fetch_upstream_icon = true
    github_icon = ""

[[blocks]]
alignment = "left"
type = "prompt"

  [[blocks.segments]]
  foreground = "p:green"
  style = "plain"
  template = " {{ .FormattedMs }} "
  type = "executiontime"

    [blocks.segments.options]
    style = "austin"

# ─── Claude Code statusline ─────────────────────────────────────────────
# Plain-style sections separated by gray middle dots. Order matters.

[[blocks]]
alignment = "left"
newline = true
type = "prompt"

  # Pill 1 — Model
  [[blocks.segments]]
  type = "claude"
  style = "plain"
  foreground = "p:model-fg"
  template = "󰣖 {{ .Model.DisplayName }}{{ if .Effort }} {{ .Effort.Level }}{{ end }}{{ if .OutputStyle }} 󱠓 {{ .OutputStyle.Name }}{{ end }}"

  # Pill 2 — Session: context %, cost, lines, cache, worktree, PR
  [[blocks.segments]]
  type = "claude"
  style = "plain"
  foreground = "p:session-fg"
  template = """
 <p:gray>·</> 󰻞 {{ .TokenUsagePercent.String }}% <p:yellow>{{ .FormattedCost }}</>{{ if and .Cost (or .Cost.TotalLinesAdded .Cost.TotalLinesRemoved) }} <p:green>+{{ .Cost.TotalLinesAdded }}</> <p:red>-{{ .Cost.TotalLinesRemoved }}</>{{ end }}\
{{ if and .PromptCache .PromptCache.CachingObserved }}{{ if or (not .PromptCache.Warm) (le .PromptCacheExpiresIn.Seconds 0.0) }} \U000F1640 {{ else }} \U000F163F {{ add (div (int .PromptCacheExpiresIn.Seconds) 60) 1 }}m{{ end }}{{ end }}\
{{ if .Worktree }} \U000F062C {{ .Worktree.Name }}{{ end }}\
{{ if .PR }} <{{ if eq .PR.ReviewState "approved" }}p:green{{ else if eq .PR.ReviewState "pending" }}p:yellow{{ else if eq .PR.ReviewState "changes_requested" }}p:red{{ else }}p:gray{{ end }}>\
{{ if contains "gitlab" .PR.URL }}\U000F0BA0 {{ url (print "!" .PR.Number) .PR.URL }}{{ else }}\U000F02A4 {{ url (print "#" .PR.Number) .PR.URL }}{{ end }}</>{{ end }}\
"""

  # Pill 3 — 5-hour rate limit
  [[blocks.segments]]
  type = "claude"
  style = "plain"
  foreground = "p:rate5h-fg"
  template = """
{{ if and .RateLimits .RateLimits.FiveHour.UsedPercentage }} <p:gray>·</> \
     {{ .FiveHourUsage.String }}% \
{{ $fhDelta := sub (.RateLimits.FiveHour.UsedPercentage | int) (div (mul (sub 18000 (sub (.RateLimits.FiveHour.ResetsAt | int64) now.Unix)) 100) 18000) }}\
{{ if gt $fhDelta 5 }}<p:red>\U000F0907</>{{ else if lt $fhDelta -5 }}<p:green>\U000F1677</>{{ else }}<p:gray>≈</>{{ end }} \
{{ secondsRound (mul (div (int .FiveHourResetsIn.Seconds) 60) 60) }}\
{{ end }}\
"""

  # Pill 4 — 7-day rate limit
  [[blocks.segments]]
  type = "claude"
  style = "plain"
  foreground = "p:rate7d-fg"
  template = """
{{ if and .RateLimits .RateLimits.SevenDay.UsedPercentage }} <p:gray>·</> \
    󰨳 {{ .SevenDayUsage.String }}% \
{{ $wkDelta := sub (.RateLimits.SevenDay.UsedPercentage | int) (div (mul (sub 604800 (sub (.RateLimits.SevenDay.ResetsAt | int64) now.Unix)) 100) 604800) }}\
{{ if gt $wkDelta 5 }}<p:red>\U000F0907</>{{ else if lt $wkDelta -5 }}<p:green>\U000F1677</>{{ else }}<p:gray>≈</>{{ end }} \
{{ secondsRound (mul (div (int .SevenDayResetsIn.Seconds) 60) 60) }}\
{{ end }}\
"""

  # Pill 5 — Clock (no background, just trailing text)
  [[blocks.segments]]
  type = "text"
  style = "plain"
  foreground = "p:gray"
  template = " · {{ now.Format \"15:04\" }}"
