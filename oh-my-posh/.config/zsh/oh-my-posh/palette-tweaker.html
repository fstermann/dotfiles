<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>pure.claude palette tweaker</title>
<style>
  :root {
    --term-bg: #1e1e2e;
    --term-fg: #cdd6f4;
    --panel:   #232336;
    --border:  #393952;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--term-bg);
    color: var(--term-fg);
    font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
    font-size: 14px;
  }
  h1 { font-size: 16px; margin: 0 0 16px; font-weight: 500; opacity: 0.8; }
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1100px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .section-head:not(:first-child) { margin-top: 18px; }
  .section-head h2 { font-size: 13px; margin: 0; font-weight: 500; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.05em; }
  .reset-section { font-size: 10px; padding: 3px 8px; opacity: 0.6; }
  .reset-section:hover { opacity: 1; }

  .color-row { display: grid; grid-template-columns: 110px 32px 1fr 22px; gap: 10px; align-items: center; margin-bottom: 6px; }
  .color-row label { font-size: 12px; opacity: 0.8; }
  .color-row input[type=color] { width: 32px; height: 22px; padding: 0; border: 1px solid var(--border); border-radius: 3px; background: transparent; cursor: pointer; }
  .color-row .hex { font-size: 11.5px; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .reset-one {
    background: transparent; border: 1px solid transparent; color: var(--term-fg);
    opacity: 0.35; cursor: pointer; padding: 0; width: 22px; height: 22px;
    border-radius: 4px; font-size: 13px; line-height: 1;
  }
  .reset-one:hover { opacity: 1; background: #2c2c44; border-color: var(--border); }
  .reset-one[disabled] { opacity: 0.1; cursor: default; }

  .preview {
    background: var(--term-bg);
    padding: 32px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
    font-size: 14px;
    line-height: 1;
    white-space: nowrap;
    overflow-x: auto;
  }

  pre.output {
    background: #15151f;
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 0;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
  button {
    background: #2c2c44; color: var(--term-fg); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 4px; cursor: pointer; font: inherit; font-size: 12px;
  }
  button:hover { background: #353554; }
  .source-hint { font-size: 11px; opacity: 0.5; margin-bottom: 12px; }
  .source-hint.error { color: #ffb3b3; opacity: 0.8; }

  .preview-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; font-size: 11px; opacity: 0.85; }
  .preview-bar #bg_presets { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .preview-bar .lbl { opacity: 0.6; margin-right: 4px; }
  .preview-bar button.bg-preset {
    padding: 3px 9px; font-size: 11px; border-radius: 3px; background: #2c2c44;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .preview-bar button.bg-preset.active { outline: 1px solid var(--term-fg); outline-offset: 1px; }
  .preview-bar .preset-swatch { width: 11px; height: 11px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.15); }
  .preview-bar input[type=color] {
    width: 28px; height: 24px; padding: 0; border: 1px solid var(--border); border-radius: 3px; background: transparent; cursor: pointer;
  }
  .preview-bar code { background: #15151f; padding: 2px 6px; border-radius: 3px; font-size: 10.5px; }
</style>
</head>
<body>
  <h1>pure.claude palette tweaker</h1>
  <div class="source-hint" id="source_hint">Loading defaults from pure.claude.toml…</div>

  <div class="preview-bar" id="preview_bar">
    <span class="lbl">preview bg:</span>
    <span id="bg_presets"></span>
    <input type="color" id="bg_custom" value="#1e1e2e" title="Custom color">
    <code id="bg_current">#1e1e2e</code>
  </div>
  <div class="preview" id="preview"></div>

  <div class="layout">
    <div class="panel">
      <div class="section-head">
        <h2>Section colors</h2>
        <button class="reset-section" data-section="sections">↺ reset</button>
      </div>
      <div class="color-row" data-section="sections"><label>model-fg</label><input type="color" id="model-fg"><span class="hex" id="model-fg_v"></span><button class="reset-one" data-target="model-fg" title="Reset">↺</button></div>
      <div class="color-row" data-section="sections"><label>session-fg</label><input type="color" id="session-fg"><span class="hex" id="session-fg_v"></span><button class="reset-one" data-target="session-fg" title="Reset">↺</button></div>
      <div class="color-row" data-section="sections"><label>rate5h-fg</label><input type="color" id="rate5h-fg"><span class="hex" id="rate5h-fg_v"></span><button class="reset-one" data-target="rate5h-fg" title="Reset">↺</button></div>
      <div class="color-row" data-section="sections"><label>rate7d-fg</label><input type="color" id="rate7d-fg"><span class="hex" id="rate7d-fg_v"></span><button class="reset-one" data-target="rate7d-fg" title="Reset">↺</button></div>
    </div>

    <div class="panel">
      <div class="section-head">
        <h2>Static colors</h2>
        <button class="reset-section" data-section="statics">↺ reset</button>
      </div>
      <div class="color-row" data-section="statics"><label>red</label><input type="color" id="red"><span class="hex" id="red_v"></span><button class="reset-one" data-target="red" title="Reset">↺</button></div>
      <div class="color-row" data-section="statics"><label>green</label><input type="color" id="green"><span class="hex" id="green_v"></span><button class="reset-one" data-target="green" title="Reset">↺</button></div>
      <div class="color-row" data-section="statics"><label>blue</label><input type="color" id="blue"><span class="hex" id="blue_v"></span><button class="reset-one" data-target="blue" title="Reset">↺</button></div>
      <div class="color-row" data-section="statics"><label>cyan</label><input type="color" id="cyan"><span class="hex" id="cyan_v"></span><button class="reset-one" data-target="cyan" title="Reset">↺</button></div>
      <div class="color-row" data-section="statics"><label>pink</label><input type="color" id="pink"><span class="hex" id="pink_v"></span><button class="reset-one" data-target="pink" title="Reset">↺</button></div>
      <div class="color-row" data-section="statics"><label>yellow</label><input type="color" id="yellow"><span class="hex" id="yellow_v"></span><button class="reset-one" data-target="yellow" title="Reset">↺</button></div>
      <div class="color-row" data-section="statics"><label>gray</label><input type="color" id="gray"><span class="hex" id="gray_v"></span><button class="reset-one" data-target="gray" title="Reset">↺</button></div>

      <div class="section-head">
        <h2>Output</h2>
      </div>
      <div class="toolbar">
        <button id="copy">Copy palette block</button>
        <button id="reset_all">↺ reset all</button>
      </div>
      <pre class="output" id="output"></pre>
    </div>
  </div>

<script>
const STATIC_KEYS  = ['red','green','blue','cyan','pink','yellow','gray'];
const SECTION_KEYS = ['model-fg','session-fg','rate5h-fg','rate7d-fg'];
const ALL_KEYS = [...SECTION_KEYS, ...STATIC_KEYS];

// Hardcoded fallback (matches the toml shipped alongside this file).
const FALLBACK = {
  red:'#bf616a', green:'#a3be8c', blue:'#81a1c1',
  cyan:'#88c0d0', pink:'#ffafd7', yellow:'#ebcb8b', gray:'#6c6c6c',
  'model-fg':'#d7d0f3',
  'session-fg':'#c2d8f6',
  'rate5h-fg':'#dfd6b3',
  'rate7d-fg':'#b9e0cf',
};

let defaults = null;

function parsePaletteToml(text) {
  const out = {};
  const m = text.match(/^\s*\[palette\]\s*$/m);
  if (!m) return null;
  const rest = text.slice(m.index + m[0].length);
  const end = rest.match(/^\s*\[/m);
  const body = end ? rest.slice(0, end.index) : rest;
  for (const line of body.split('\n')) {
    const kv = line.match(/^\s*([A-Za-z0-9_-]+)\s*=\s*"(#[0-9a-fA-F]{6})"/);
    if (kv) out[kv[1]] = kv[2].toLowerCase();
  }
  return out;
}

function val(id) { return document.getElementById(id).value; }

function applyDefaults(d) {
  defaults = d;
  for (const k of ALL_KEYS) {
    const el = document.getElementById(k);
    if (el && d[k]) el.value = d[k];
  }
  render();
}

function sectionContent(name, c) {
  switch (name) {
    case 'model':
      return `<span style="color:${c['model-fg']}">✦ Opus 4.7 (1M context) medium</span>`;
    case 'session':
      return `<span style="color:${c['session-fg']}">○ 3% <span style="color:${c.yellow}">$0.31</span> <span style="color:${c.green}">+3</span> <span style="color:${c.red}">−3</span></span>`;
    case 'rate5h':
      return `<span style="color:${c['rate5h-fg']}">⏱ 64% <span style="color:${c.red}">↑</span> 1h 29m</span>`;
    case 'rate7d':
      return `<span style="color:${c['rate7d-fg']}">▦ 26% <span style="color:${c.green}">↓</span> 5h 19m</span>`;
  }
}

function render() {
  const c = {};
  for (const k of ALL_KEYS) {
    c[k] = val(k);
    const hex = document.getElementById(k + '_v');
    if (hex) hex.textContent = c[k];
    const btn = document.querySelector(`.reset-one[data-target="${k}"]`);
    if (btn && defaults) btn.disabled = (c[k].toLowerCase() === (defaults[k] || '').toLowerCase());
  }

  const preview = document.getElementById('preview');
  preview.innerHTML = '';
  ['model','session','rate5h','rate7d'].forEach((name, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.style.color = c.gray;
      sep.textContent = ' · ';
      preview.appendChild(sep);
    }
    const seg = document.createElement('span');
    seg.innerHTML = sectionContent(name, c);
    preview.appendChild(seg);
  });
  const clock = document.createElement('span');
  clock.style.color = c.gray;
  clock.style.marginLeft = '12px';
  clock.textContent = '13:40';
  preview.appendChild(clock);

  const lines = [
    '[palette]',
    `red          = "${c.red}"`,
    `green        = "${c.green}"`,
    `blue         = "${c.blue}"`,
    `cyan         = "${c.cyan}"`,
    `pink         = "${c.pink}"`,
    `yellow       = "${c.yellow}"`,
    `gray         = "${c.gray}"`,
    '',
    `model-fg       = "${c['model-fg']}"`,
    `session-fg     = "${c['session-fg']}"`,
    `rate5h-fg      = "${c['rate5h-fg']}"`,
    `rate7d-fg      = "${c['rate7d-fg']}"`,
  ];
  document.getElementById('output').textContent = lines.join('\n');
}

// ─── Preview background presets ───────────────────────────────────────
const BG_PRESETS = [
  { name: 'VS Code dark',    color: '#1e1e1e' },
  { name: 'VS Code dark+',   color: '#1f1f1f' },
  { name: 'Monokai Filter Octagon', color: '#3b3d4b' },
  { name: 'Catppuccin Mocha',color: '#1e1e2e' },
  { name: 'macOS Terminal',  color: '#000000' },
  { name: 'Solarized dark',  color: '#002b36' },
  { name: 'iTerm light',     color: '#ffffff' },
  { name: 'Solarized light', color: '#fdf6e3' },
];

function setPreviewBg(color) {
  const preview = document.getElementById('preview');
  preview.style.background = color;
  document.getElementById('bg_current').textContent = color;
  document.getElementById('bg_custom').value = color.length === 7 ? color : '#000000';
  document.querySelectorAll('.bg-preset').forEach(b => {
    b.classList.toggle('active', b.dataset.color.toLowerCase() === color.toLowerCase());
  });
  try { localStorage.setItem('palette-tweaker:preview-bg', color); } catch (e) {}
}

(function initBgPresets() {
  const host = document.getElementById('bg_presets');
  for (const p of BG_PRESETS) {
    const btn = document.createElement('button');
    btn.className = 'bg-preset';
    btn.dataset.color = p.color;
    btn.title = `${p.name} (${p.color})`;
    btn.innerHTML = `<span class="preset-swatch" style="background:${p.color}"></span>${p.name}`;
    btn.addEventListener('click', () => setPreviewBg(p.color));
    host.appendChild(btn);
  }
  document.getElementById('bg_custom').addEventListener('input', e => setPreviewBg(e.target.value));
  const saved = (() => { try { return localStorage.getItem('palette-tweaker:preview-bg'); } catch (e) { return null; } })();
  setPreviewBg(saved || '#1e1e2e');
})();

// ─── Wire up controls ─────────────────────────────────────────────────
for (const k of ALL_KEYS) document.getElementById(k).addEventListener('input', render);

document.getElementById('copy').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('output').textContent);
});

document.getElementById('reset_all').addEventListener('click', () => {
  if (!defaults) return;
  for (const k of ALL_KEYS) if (defaults[k]) document.getElementById(k).value = defaults[k];
  render();
});

document.querySelectorAll('.reset-one').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.target;
    if (!defaults || !defaults[t]) return;
    document.getElementById(t).value = defaults[t];
    render();
  });
});

document.querySelectorAll('.reset-section').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!defaults) return;
    document.querySelectorAll(`[data-section="${btn.dataset.section}"]`).forEach(row => {
      const input = row.querySelector('input');
      if (input && defaults[input.id]) input.value = defaults[input.id];
    });
    render();
  });
});

// ─── Load defaults from the toml file (fallback to hardcoded) ─────────
async function init() {
  const hint = document.getElementById('source_hint');
  let palette = null;
  let source = 'fallback';
  try {
    const res = await fetch('pure.claude.toml', { cache: 'no-store' });
    if (res.ok) {
      const text = await res.text();
      palette = parsePaletteToml(text);
      if (palette) source = 'pure.claude.toml';
    }
  } catch (e) { /* file:// in Chrome blocks fetch */ }

  const merged = Object.assign({}, FALLBACK, palette || {});
  hint.textContent = source === 'pure.claude.toml'
    ? 'Defaults loaded from pure.claude.toml (live).'
    : 'Defaults from built-in fallback (could not fetch pure.claude.toml — serve over http if you want live load).';
  applyDefaults(merged);
}
init();
</script>
</body>
</html>
