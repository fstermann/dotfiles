[project]
name = "sniff-cli"
version = "0.1.0"
description = "Deterministic detector runner and LLM rule loader for the sniff skill"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.2,<7",
    "rich>=14.1.0,<15",
    "typer>=0.16.0,<1",
]

[project.scripts]
sniff = "sniff_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sniff_cli"]
